# Run once per deploy (`kubectl apply -f` then `kubectl wait --for=condition=complete
# job/migrate -n wildfirewatch`) before rolling out the api Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: wildfirewatch
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: wildfirewatch-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: wildfirewatch-config }
            - secretRef: { name: wildfirewatch-secrets }
