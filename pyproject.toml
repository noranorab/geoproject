[project]
name = "wildfirewatch"
version = "0.1.0"
description = "Satellite-based burned-area / wildfire anomaly detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3.9",
    "affine>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.8.3",
    "boto3>=1.34",
    "SQLAlchemy>=2.0",
    "GeoAlchemy2>=0.14",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "click>=8.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.scripts]
wfw = "wildfirewatch.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/wildfirewatch/migrations/versions"]

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() are meant to be used as call-in-default-argument.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
