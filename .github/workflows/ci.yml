name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wfw
          POSTGRES_PASSWORD: wfw
          POSTGRES_DB: wildfirewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfw -d wildfirewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://wfw:wfw@localhost:5432/wildfirewatch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests airflow

      - name: Test
        run: pytest -v

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build -f Dockerfile.airflow -t wfw-airflow-ci .

      - name: Check DAG imports
        run: |
          docker run --rm --entrypoint python \
            -v "${{ github.workspace }}/airflow/dags:/opt/airflow/dags" \
            wfw-airflow-ci -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder='/opt/airflow/dags')
          for path, error in bag.import_errors.items():
              print(f'{path}: {error}')
          assert not bag.import_errors, 'DAG import errors found'
          assert bag.dags, 'No DAGs found in dag_folder'
          print('DAGs loaded OK:', list(bag.dags))
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check & build
        run: npm run build
