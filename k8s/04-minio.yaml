# Self-hosted MinIO for dev/demo clusters. In production, point
# S3_ENDPOINT_URL (in the ConfigMap) at AWS S3 (see terraform/) and drop
# this file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: wildfirewatch
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: wildfirewatch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: wildfirewatch-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wildfirewatch-secrets, key: MINIO_ROOT_PASSWORD }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: wildfirewatch
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# One-shot bucket creation, mirrors docker-compose's minio-init.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: wildfirewatch
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          envFrom:
            - secretRef: { name: wildfirewatch-secrets }
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc ready local; do
                sleep 2
              done
              mc mb -p local/wildfirewatch-raw local/wildfirewatch-processed
