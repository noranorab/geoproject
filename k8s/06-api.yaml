apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wildfirewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: wildfirewatch-api:latest
          imagePullPolicy: IfNotPresent
          command:
            [
              "uvicorn",
              "wildfirewatch.api.main:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
            ]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: wildfirewatch-config }
            - secretRef: { name: wildfirewatch-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wildfirewatch
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
