# Template only -- do not apply as-is. Copy to 02-secret.yaml (gitignored),
# fill in real values, and `kubectl apply -f`; in a real cluster use
# something like External Secrets Operator or Sealed Secrets instead of a
# plain Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: wildfirewatch-secrets
  namespace: wildfirewatch
type: Opaque
stringData:
  # Must match POSTGRES_PASSWORD below.
  DATABASE_URL: "postgresql+psycopg2://wfw:CHANGE_ME@postgres:5432/wildfirewatch"
  POSTGRES_PASSWORD: "CHANGE_ME"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
  MINIO_ROOT_USER: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
