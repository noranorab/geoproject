services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wfw
      POSTGRES_PASSWORD: wfw
      POSTGRES_DB: wildfirewatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfw -d wildfirewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wfwminio
      MINIO_ROOT_PASSWORD: wfwminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 wfwminio wfwminio123 &&
      mc mb -p local/wildfirewatch-raw local/wildfirewatch-processed &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn wildfirewatch.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://wfw:wfw@postgres:5432/wildfirewatch
      S3_ENDPOINT_URL: http://minio:9000
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://wfw:wfw@postgres:5432/wildfirewatch
      S3_ENDPOINT_URL: http://minio:9000
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      LOG_FORMAT: json
      PUSHGATEWAY_URL: http://pushgateway:9091
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  airflow_data:
  prometheus_data:
  grafana_data:
